[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-audit"
version = "0.4.0"
description = "Security audit daemon for AI agent installations (OpenClaw, Hermes, ...)"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Kevin Badinger"}]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",

    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
keywords = ["openclaw", "hermes", "security", "audit", "ai-agent", "monitoring"]
dependencies = [
    "watchdog>=3.0",
    "psutil>=5.9",
    "jinja2>=3.1",
    "json5>=0.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.6",
    "pytest>=8.0",
    "ruff>=0.11",
]

[project.urls]
Homepage = "https://github.com/kbadinger/ai-agent-audit"
Repository = "https://github.com/kbadinger/ai-agent-audit"
Issues = "https://github.com/kbadinger/ai-agent-audit/issues"
Changelog = "https://github.com/kbadinger/ai-agent-audit/blob/main/.subframe/docs-internal/changelog.md"
Security = "https://github.com/kbadinger/ai-agent-audit/security/policy"

[project.scripts]
ai-agent-audit = "ai_agent_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_agent_audit = ["templates/*.j2", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["ai_agent_audit"]
branch = true

[tool.coverage.report]
fail_under = 40
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100
