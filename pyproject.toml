[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-audit"
version = "0.2.0"
description = "Security audit daemon for AI agent installations (OpenClaw, Hermes, ...)"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Kevin Badinger"}]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",

    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
keywords = ["openclaw", "hermes", "security", "audit", "ai-agent", "monitoring"]
dependencies = [
    "watchdog>=3.0",
    "psutil>=5.9",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/kbadinger/ai-agent-audit"
Repository = "https://github.com/kbadinger/ai-agent-audit"
Issues = "https://github.com/kbadinger/ai-agent-audit/issues"

[project.scripts]
ai-agent-audit = "ai_agent_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_agent_audit = ["templates/*.j2"]
