name: Bug report
description: Report reproducible incorrect behavior in ai-agent-audit.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private session content, or vulnerability details.
        Report security issues through the private link in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: ai-agent-audit version
      placeholder: 0.4.0
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent profile
      options:
        - OpenClaw
        - Hermes
        - Other or auto-detection issue
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version.
      placeholder: macOS 15, Python 3.13
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe reproduction you can.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized output
      description: Remove tokens, credentials, personal paths, and session content.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed secrets and private data from this report.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
