name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        run: pytest tests/ -v

  quality:
    name: Coverage and critical lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install package + quality deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Check for syntax and undefined-name errors
        run: ruff check --select E9,F63,F7,F82 .
      - name: Enforce coverage floor
        run: |
          coverage run -m pytest tests/ -q
          coverage report

  self-scan:
    name: Self-scan (dogfood)
    runs-on: ubuntu-latest
    needs: [test, quality]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run security sweep
        run: ai-agent-audit sweep
      - name: Export findings as SARIF
        run: ai-agent-audit export --format sarif --output ai-agent-audit.sarif
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-audit-sarif
          path: ai-agent-audit.sarif
      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ai-agent-audit.sarif
        # Requires Code Scanning to be enabled on the repo; don't fail CI if not.
        continue-on-error: true
