name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run test suite
        run: pytest tests/ -v

  quality:
    name: Coverage and critical lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install package + quality deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Check for syntax and undefined-name errors
        run: ruff check --select E9,F63,F7,F82 .
      - name: Enforce coverage floor
        run: |
          coverage run -m pytest tests/ -q
          coverage report

  self-scan:
    name: Self-scan (dogfood)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, quality]
    env:
      AI_AGENT_AUDIT_ADVISORY_AUTOREFRESH: "0"
      AI_AGENT_AUDIT_IOC_AUTOREFRESH: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run security sweep
        run: ai-agent-audit sweep --fail-on error
      - name: Export findings as SARIF
        run: ai-agent-audit export --format sarif --output ai-agent-audit.sarif
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-agent-audit-sarif
          path: ai-agent-audit.sarif
          retention-days: 14
